<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Растения против Зомби | PvZ Classic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="game-main">
                <canvas id="gameCanvas" width="934" height="640"></canvas>

                <div id="pauseOverlay" class="pause-overlay hidden">
                    <div class="pause-dialog">
                        <h2>ПАУЗА</h2>
                        <button id="resumeOverlayBtn" class="resume-btn">ПРОДОЛЖИТЬ</button>
                        <button id="restartOverlayBtn" class="restart-btn">НАЧАТЬ ЗАНОВО</button>
                        <button id="quitOverlayBtn" class="quit-btn">ГЛАВНОЕ МЕНЮ</button>
                    </div>
                </div>

                <div class="info-panel">
                    <div class="sun-display">
                        <span id="sunAmount">150</span>
                    </div>
                    <div class="score-board">
                        Счёт: <span id="scoreValue">0</span>
                    </div>
                    <button class="pause-btn" id="pauseBtn">ПАУЗА</button>
                </div>
            </div>

            <div class="plant-shop">
                <div class="shop-title">ВЫБЕРИ РАСТЕНИЕ</div>
                <div class="shop-items-container">
                    <div class="shop-items">
                        <div class="shop-item" data-plant="pea" data-cooldown="5">
                            <img src="images/pea-shooter.png" alt="Горохострел" class="shop-plant-img">
                            <div class="shop-name">Горохострел</div>
                            <div class="shop-cost">100</div>
                        </div>
                        <div class="shop-item" data-plant="sunflower" data-cooldown="3">
                            <img src="images/sunflower.png" alt="Подсолнух" class="shop-plant-img">
                            <div class="shop-name">Подсолнух</div>
                            <div class="shop-cost">50</div>
                        </div>
                        <div class="shop-item" data-plant="walnut" data-cooldown="4">
                            <img src="images/walnut.png" alt="Орех" class="shop-plant-img">
                            <div class="shop-name">Орех</div>
                            <div class="shop-cost">50</div>
                        </div>
                        <div class="shop-item" data-plant="iceshooter" data-cooldown="7">
                            <img src="images/ice-shooter.png" alt="Ледострел" class="shop-plant-img">
                            <div class="shop-name">Ледострел</div>
                            <div class="shop-cost">150</div>
                        </div>
                        <div class="shop-item" data-plant="spikerock" data-cooldown="8">
                            <img src="images/spikerock.png" alt="Колючка" class="shop-plant-img">
                            <div class="shop-name">Колючка</div>
                            <div class="shop-cost">125</div>
                        </div>
                    </div>
                </div>
                <div class="shop-tip">Чтобы удалить растение - нажми ПКМ (+30%)</div>
            </div>
        </div>

        <div class="last-game-stats">
            <h3>ПОСЛЕДНЯЯ ИГРА</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">ВОЛНЫ:</span>
                    <span class="stat-value" id="lastWave">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">СЧЕТ:</span>
                    <span class="stat-value" id="lastScore">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">УБИТО:</span>
                    <span class="stat-value" id="lastKills">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">ДАТА:</span>
                    <span class="stat-value" id="lastDate">-</span>
                </div>
            </div>
        </div>

        <div class="top-players-full">
            <h3>ТОП ИГРОКОВ</h3>
            <div class="top-table-full">
                <div class="top-header-full">
                    <span class="top-place-full">#</span>
                    <span class="top-name-full">ИГРОК</span>
                    <span class="top-score-full">СЧЁТ</span>
                    <span class="top-wave-full">ВОЛНА</span>
                    <span class="top-kills-full">УБИТО</span>
                    <span class="top-date-full">ДАТА</span>
                </div>
                <div id="topPlayersListFull" class="top-list-full">
                    <div class="top-row-full">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="startMenu" class="start-menu">
        <div class="start-menu-content">
            <h1 class="game-title">
                <span class="plants-text">PLANTS</span>
                <span class="vs-text">VS</span>
                <span class="zombies-text">ZOMBIES</span>
            </h1>
            <div class="game-icons">
                <div class="plant-icon">
                    <img src="images/pea-shooter.png" alt="Plant">
                </div>
                <div class="zombie-icon">
                    <img src="images/zombie-normal.png" alt="Zombie">
                </div>
            </div>
            <button class="play-btn" id="playBtn">START GAME</button>
        </div>
    </div>

<div id="authModal" class="auth-modal" style="display: none;">
    <div class="auth-content">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">ВХОД</button>
            <button class="auth-tab" data-tab="register">РЕГИСТРАЦИЯ</button>
        </div>
        
        <!-- ФОРМА ВХОДА -->
        <div id="loginForm" class="auth-form active">
            <input type="text" id="loginIdentifier" placeholder="EMAIL ИЛИ НИК" class="auth-input">
            <input type="password" id="loginPassword" placeholder="ПАРОЛЬ" class="auth-input">
            <button id="loginBtn" class="auth-btn">ВОЙТИ</button>
            <button id="forgotPasswordBtn" type="button" style="background:transparent; border:none; color:#ffaa66; font-family:'Press Start 2P'; font-size:0.5rem; margin-top:10px; cursor:pointer; text-decoration:underline; width:100%;">ЗАБЫЛИ ПАРОЛЬ?</button>
            <div class="auth-error" id="loginError"></div>
        </div>
        
        <!-- ФОРМА РЕГИСТРАЦИИ -->
        <div id="registerForm" class="auth-form">
            <input type="email" id="regEmail" placeholder="EMAIL" class="auth-input">
            <input type="text" id="regNickname" placeholder="НИКНЕЙМ" class="auth-input">
            <input type="password" id="regPassword" placeholder="ПАРОЛЬ" class="auth-input">
            <input type="password" id="regConfirmPassword" placeholder="ПОДТВЕРДИТЕ ПАРОЛЬ" class="auth-input">
            <button id="registerBtn" class="auth-btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
            <div class="auth-error" id="registerError"></div>
        </div>
    </div>
</div>

<!-- Модальное окно восстановления пароля -->
<div id="resetModal" class="auth-modal" style="display: none;">
    <div class="auth-content">
        <h3 style="color:#ffefb0; font-family:'Press Start 2P'; font-size:0.8rem; text-align:center; margin-bottom:20px;">
            ВОССТАНОВЛЕНИЕ ПАРОЛЯ
        </h3>
        
        <div id="resetStep1">
            <input type="email" id="resetEmail" placeholder="EMAIL" class="auth-input">
            <button id="requestResetBtn" class="auth-btn">ЗАПРОСИТЬ КОД</button>
            <button id="backToLoginFromReset" class="auth-btn" style="background:#5a5a5a; margin-top:10px;">НАЗАД</button>
            <div id="resetError" class="auth-error"></div>
        </div>
        
        <div id="resetStep2" style="display: none;">
            <input type="text" id="resetCode" placeholder="КОД ИЗ EMAIL" class="auth-input">
            <input type="password" id="resetNewPassword" placeholder="НОВЫЙ ПАРОЛЬ" class="auth-input">
            <input type="password" id="resetConfirmNewPassword" placeholder="ПОДТВЕРДИТЕ ПАРОЛЬ" class="auth-input">
            <button id="confirmResetBtn" class="auth-btn">СБРОСИТЬ ПАРОЛЬ</button>
            <button id="backToResetStep1" class="auth-btn" style="background:#5a5a5a; margin-top:10px;">НАЗАД</button>
            <div id="resetSuccess" class="auth-error" style="color:#6eff3a;"></div>
            <div id="resetStep2Error" class="auth-error"></div>
        </div>
    </div>
</div>

<!-- Панель пользователя -->
<div id="userPanel" class="user-panel" style="display: none;">
    <div class="user-info">
         <span id="userNickname"></span>
    </div>
    <button id="logoutBtn" class="logout-btn">ВЫЙТИ</button>
</div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>

</html>
